<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dior-code | Starry HQ</title>
    <style>
        :root {
            --bg-color: #0b0d17;
            --card-bg: rgba(20, 24, 45, 0.65);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景星空渐变与光晕 */
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: 20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(139, 92, 246, 0.1) 40%, transparent 70%);
            z-index: -1;
            pointer-events: none;
            filter: blur(50px);
        }

        /* 顶部毛玻璃导航栏 */
        nav {
            width: 100%;
            background: rgba(11, 13, 23, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 18px 0;
            position: sticky;
            top: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            gap: 32px;
            z-index: 100;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.3s;
            position: relative;
        }

        nav a:hover, nav a.active {
            color: #ffffff;
            text-shadow: 0 0 12px var(--accent-glow);
        }

        nav a.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            border-radius: 2px;
        }

        /* 居中主容器 */
        .container {
            margin: 80px auto 40px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 48px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            max-width: 580px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .hero-desc {
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .highlight {
            color: var(--accent);
            font-weight: 600;
        }

        /* 按钮组 */
        .cta-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .btn {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #030712;
            padding: 12px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(56, 189, 248, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <nav>
        <a href="index.html" class="active">Home</a>
        <a href="about.html">About Me</a>
        <a href="projects.html">Projects</a>
    </nav>

    <!-- 卡片主体 -->
    <div class="container">
        <h1>👋 Welcome to My Digital HQ</h1>
        <p class="hero-desc">
            Hi, I'm <span class="highlight">dior-code</span>. I build web experiences and document my creator journey from zero to one.
        </p>

        <div class="cta-buttons">
            <a href="about.html" class="btn">Read My Story</a>
            <a href="projects.html" class="btn btn-secondary">Explore Projects</a>
        </div>
    </div>

</body>
</html>
