<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dior-code | Home</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        /* 顶部导航栏 */
        nav {
            width: 100%;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            padding: 16px 0;
            position: sticky;
            top: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            gap: 24px;
        }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: color 0.2s;
        }
        nav a:hover, nav a.active {
            color: var(--accent);
        }
        /* 主内容卡片 */
        .container {
            margin-top: 60px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 85%;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        h1 { font-size: 26px; margin-bottom: 12px; }
        p { color: var(--text-muted); font-size: 15px; line-height: 1.6; }
        .tag {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- 顶部导航栏 -->
    <nav>
        <a href="index.html" class="active">Home</a>
        <a href="about.html">About Me</a>
        <a href="projects.html">Projects</a>
    </nav>

    <!-- 首页卡片内容 -->
    <div class="container">
        <h1>👋 Welcome to My Digital Hub</h1>
        <p>Hi, I'm <strong>dior-code</strong>. This is my personal space on the web built entirely from scratch.</p>
        <p>Feel free to explore around using the navigation bar above!</p>
        <span class="tag">🚀 Status: Building & Exploring</span>
    </div>

</body>
</html>
