<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dior-code | Digital Space</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        h2 {
            font-size: 16px;
            color: var(--accent);
            margin-top: 24px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .tag {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .links {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .btn {
            flex: 1;
            text-align: center;
            background: var(--accent);
            color: #0f172a;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: var(--accent-hover);
        }
        .btn-outline {
            background: transparent;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>👋 Hello, I'm dior-code</h1>
        <p>Welcome to my digital space. I'm exploring web development, tech, and building things on the internet from scratch.</p>
        
        <h2>My Interests</h2>
        <div class="tags">
            <span class="tag">#WebDev</span>
            <span class="tag">#Design</span>
            <span class="tag">#Reading</span>
            <span class="tag">#TechExplorer</span>
        </div>

        <h2>Current Status</h2>
        <p>🚀 Building my first website and learning HTML/CSS step by step.</p>

        <div class="links">
            <a href="https://github.com/dior-code" target="_blank" class="btn">GitHub</a>
            <a href="mailto:your-email@example.com" class="btn btn-outline">Contact Me</a>
        </div>
    </div>
</body>
</html>
