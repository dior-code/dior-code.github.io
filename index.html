<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dior-code | Starry Space</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(30, 41, 59, 0.75);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
        }

        /* 宇宙星空背景样式 */
        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 顶部导航栏（半透明玻璃拟态效果） */
        nav {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            padding: 16px 0;
            position: sticky;
            top: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            gap: 24px;
            z-index: 100;
        }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: color 0.2s;
        }
        nav a:hover, nav a.active { 
            color: var(--accent); 
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        
        /* 星空下的内容卡片 */
        .container {
            margin: 60px 0;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            max-width: 540px;
            width: 85%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        
        h1 { 
            font-size: 28px; 
            margin-bottom: 12px; 
            color: var(--text-main); 
        }
        
        .hero-desc { 
            color: var(--text-muted); 
            font-size: 15px; 
            line-height: 1.7; 
            margin-bottom: 24px; 
        }
        
        .highlight { 
            color: var(--accent); 
            font-weight: 600; 
        }
        
        .cta-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 24px;
        }
        
        .btn {
            background: var(--accent);
            color: #030712;
            padding: 10px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
        .btn:hover { 
            background: var(--accent-hover); 
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: none;
        }
        .btn-secondary:hover { 
            background: rgba(255, 255, 255, 0.05); 
            box-shadow: none;
        }
    </style>
</head>
<body>

    <!-- 顶部导航栏 -->
    <nav>
        <a href="index.html" class="active">Home</a>
        <a href="about.html">About Me</a>
        <a href="projects.html">Projects</a>
    </nav>

    <!-- 星空主卡片 -->
    <div class="container">
        <h1>✨ Welcome to My Starry Space</h1>
        <p class="hero-desc">
            Hi, I'm <span class="highlight">dior-code</span>. Step into my digital universe where I explore web development and build my creator journey from scratch.
        </p>

        <div class="cta-buttons">
            <a href="about.html" class="btn">About Me</a>
            <a href="projects.html" class="btn btn-secondary">View Projects</a>
        </div>
    </div>

</body>
</html>
