<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dior-code | Home</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        nav {
            width: 100%;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            padding: 16px 0;
            position: sticky;
            top: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            gap: 24px;
            z-index: 100;
        }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: color 0.2s;
        }
        nav a:hover, nav a.active { color: var(--accent); }
        
        .container {
            margin: 40px 0;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            max-width: 540px;
            width: 85%;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }
        h1 { font-size: 28px; margin-bottom: 12px; color: var(--text-main); }
        .hero-desc { color: var(--text-muted); font-size: 16px; line-height: 1.7; margin-bottom: 24px; }
        .highlight { color: var(--accent); font-weight: 600; }
        
        .cta-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 24px;
        }
        .btn {
            background: var(--accent);
            color: #0f172a;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn-secondary {
            background: transparent;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body>

    <!-- 顶部导航栏 -->
    <nav>
        <a href="index.html" class="active">Home</a>
        <a href="about.html">About Me</a>
        <a href="projects.html">Projects</a>
    </nav>

    <!-- 首页 主卡片 -->
    <div class="container">
        <h1>👋 Welcome to My Digital HQ</h1>
        <p class="hero-desc">
            Hi, I'm <span class="highlight">dior-code</span>. I build web experiences and document my creator journey from zero to one.
        </p>
        <p style="font-size: 14px; color: var(--text-muted);">
            This website is my personal sandbox for projects, ideas, and content.
        </p>

        <div class="cta-buttons">
            <a href="about.html" class="btn">Read My Story</a>
            <a href="projects.html" class="btn btn-secondary">Explore Projects</a>
        </div>
    </div>

</body>
</html>
