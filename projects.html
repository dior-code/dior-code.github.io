<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dior-code | Projects</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        nav {
            width: 100%;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            padding: 16px 0;
            position: sticky;
            top: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            gap: 24px;
            z-index: 100;
        }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: color 0.2s;
        }
        nav a:hover, nav a.active { color: var(--accent); }
        
        .container {
            margin: 40px 0;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            max-width: 540px;
            width: 85%;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        h1 { font-size: 26px; margin-bottom: 8px; color: var(--text-main); }
        .subtitle { color: var(--accent); font-size: 14px; font-weight: 600; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 1px; }
        
        .project-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }
        .project-card:hover {
            border-color: rgba(56, 189, 248, 0.3);
        }
        .project-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }
        .project-desc {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- 顶部导航栏 -->
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="projects.html" class="active">Projects</a>
    </nav>

    <!-- 项目展示 页面主卡片 -->
    <div class="container">
        <h1>💻 Projects</h1>
        <div class="subtitle">Things I'm working on</div>

        <div class="project-card">
            <div class="project-title">🌐 Personal Website</div>
            <p class="project-desc">
                My personal space built from scratch using HTML and CSS, hosted on GitHub Pages.
            </p>
        </div>

        <div class="project-card">
            <div class="project-title">🚀 Creator Journey</div>
            <p class="project-desc">
                Documenting my exploration into tech, web development, and digital content creation.
            </p>
        </div>

    </div>

</body>
</html>
