<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dior-code | Projects</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        nav {
            width: 100%;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            padding: 16px 0;
            position: sticky;
            top: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            gap: 24px;
        }
        nav a { color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 15px; }
        nav a:hover, nav a.active { color: var(--accent); }
        .container {
            margin-top: 60px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            max-width: 500px;
            width: 85%;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        h1 { font-size: 24px; margin-bottom: 16px; color: var(--accent); }
        .project-card {
            background: rgba(255,255,255,0.03);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .project-card h3 { margin: 0 0 8px 0; font-size: 16px; }
        .project-card p { margin: 0; font-size: 13px; color: var(--text-muted); }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="projects.html" class="active">Projects</a>
    </nav>

    <div class="container">
        <h1>💻 My Showcase</h1>
        
        <div class="project-card">
            <h3>🌐 Personal Website</h3>
            <p>Built with pure HTML/CSS and hosted for free on GitHub Pages.</p>
        </div>

        <div class="project-card">
            <h3>🚀 Next Big Thing</h3>
            <p>Work in progress. Stay tuned for more cool projects!</p>
        </div>
    </div>

</body>
</html>
